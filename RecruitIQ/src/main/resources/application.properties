spring.application.name=RecruitIQ
# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/recruitiq_db
spring.datasource.username=postgres
spring.datasource.password=vck123
spring.datasource.driver-class-name=org.postgresql.Driver
# Maximum allowed file size for multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directory on your disk where uploaded resumes will be saved
file.upload-dir=uploads/resumes

# Hibernate settings
# "update" means Hibernate will automatically create or alter tables to match your Java code without deleting existing records
spring.jpa.hibernate.ddl-auto=update

# Print raw SQL statements in the console so you can see what Hibernate generates
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true