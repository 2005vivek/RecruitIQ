version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: recruitiq-postgres
    restart: always
    environment:
      POSTGRES_DB: recruitiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitiq-api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/recruitiq_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FILE_UPLOAD_DIR: uploads/resumes
    ports:
      - "8080:8080"
    volumes:
      - resume-storage:/app/uploads/resumes

volumes:
  pgdata:
    driver: local
  resume-storage:
    driver: local